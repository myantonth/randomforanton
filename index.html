    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #C9E5FF;
      font-family: "Prompt", sans-serif;
      color: #000;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      padding: 25px 20px 60px;

      display: flex;
      flex-direction: column;
      align-items: center;

      overflow: hidden;
    }

    .title-artwork {
      position: relative;
      z-index: 5;

      width: min(92vw, 1100px);
      margin: 0 auto 5px;
    }

    .title-artwork img {
      display: block;
      width: 100%;
      height: auto;
    }

    .character-left {
      position: absolute;

      width: clamp(190px, 24vw, 330px);

      left: 0px;
      top: 170px;

      transform: rotate(90deg);
      transform-origin: center;

      z-index: 1;
      pointer-events: none;
    }

    .character-right {
      position: absolute;

      width: clamp(190px, 23vw, 320px);

      right: 0px;
      bottom: clamp(20px, 5vh, 60px);

      transform: rotate(-90deg);
      transform-origin: center;

      z-index: 3;
      pointer-events: none;
    }

    .magazine-area {
      position: relative;
      z-index: 2;

      perspective: 2200px;
    }

    .magazine {
      position: relative;

      height: min(65vh, 780px);
      aspect-ratio: 4 / 5;

      transform-style: preserve-3d;

      transition:
        width 0.7s ease,
        aspect-ratio 0.7s ease;
    }

    .magazine.open {
      aspect-ratio: 8 / 5;
    }

    .right-page {
      position: absolute;

      top: 0;
      right: 0;

      width: 50%;
      height: 100%;

      background: #fff;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 45px;

      text-align: center;

      opacity: 0;

      box-shadow:
        8px 10px 20px rgba(60, 100, 140, 0.14);

      transition: opacity 0.2s ease;
    }

    .magazine.open .right-page {
      opacity: 1;
      transition-delay: 0.35s;
    }

    .right-page::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 18px;
      height: 100%;

      background:
        linear-gradient(
          to right,
          rgba(0, 0, 0, 0.14),
          rgba(0, 0, 0, 0.04),
          transparent
        );

      pointer-events: none;
    }

    .random-label {
      margin-bottom: 30px;

      font-family: "Inter", sans-serif;
      font-size: 12px;
      font-weight: 500;

      letter-spacing: 1.5px;

      color: #5898d3;

      white-space: nowrap;
    }

    #randomText {
      max-width: 90%;

      margin: 0 0 35px;

      font-size: clamp(20px, 2.2vw, 31px);
      font-weight: 600;

      line-height: 1.55;
    }

    button {
      font-family: "Inter", "Prompt", sans-serif;
    }

    .copy-btn {
      border: 2px solid #000;

      background: transparent;
      color: #000;

      border-radius: 50px;

      padding: 10px 35px;

      font-size: 13px;
      font-weight: 500;

      cursor: pointer;
    }

    .random-again {
      position: absolute;

      bottom: 25px;

      border: 0;
      border-bottom: 1px solid #000;

      background: transparent;
      color: #000;

      padding: 3px 0;

      font-size: 11px;
      font-weight: 500;

      cursor: pointer;
    }

    .cover {
      position: absolute;

      top: 0;
      right: 0;

      width: 50%;
      height: 100%;

      transform-origin: left center;
      transform-style: preserve-3d;

      transition:
        transform 1s cubic-bezier(.65, .05, .36, 1),
        width 0.7s ease;

      z-index: 10;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .magazine:not(.open) .cover {
      width: 100%;
    }

    .cover-front,
    .cover-back {
      position: absolute;

      inset: 0;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .cover-front {
      box-shadow:
        6px 8px 16px rgba(60, 100, 140, 0.2);
    }

    .cover-front img,
    .cover-back img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      user-select: none;
      -webkit-user-drag: none;
    }

    .cover-back {
      transform: rotateY(180deg);

      overflow: hidden;

      background: #fff;

      box-shadow:
        -6px 8px 16px rgba(60, 100, 140, 0.14);
    }

    .cover-back img {
      transform: scaleX(-1);
    }

    .magazine.open .cover {
      width: 50%;
      transform: rotateY(-180deg);

      cursor: default;
    }

    .open-btn {
      position: absolute;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%);

      z-index: 20;

      background: rgba(255, 255, 255, 0.94);
      color: #000;

      border-radius: 50px;

      font-weight: 500;

      white-space: nowrap;

        font-size: 1.55vw;

    const magazine =
      document.getElementById("magazine");

    const magazineCover =
      document.getElementById("magazineCover");

    const randomText =
      document.getElementById("randomText");

    const copyButton =
      document.getElementById("copyButton");

    let lastIndex = -1;

    magazineCover.addEventListener("click", openMagazine);

    magazineCover.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openMagazine();
      }
    });

    function openMagazine() {
      if (magazine.classList.contains("open")) {
        return;
      }

      randomMessage();

      magazine.classList.add("open");
    }

    function randomMessage() {
      let randomIndex;

      do {
        randomIndex =
          Math.floor(
            Math.random() * messages.length
          );
      } while (
        messages.length > 1 &&
        randomIndex === lastIndex
      );

      lastIndex = randomIndex;

      randomText.textContent =
        messages[randomIndex];

      copyButton.textContent =
        "COPY";
    }

    async function copyText() {
      const text =
        randomText.textContent;

      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textarea =
          document.createElement("textarea");

        textarea.value = text;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();
      }

      copyButton.textContent =
        "COPIED ✓";

      setTimeout(() => {
        copyButton.textContent =
          "COPY";
      }, 1500);
